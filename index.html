<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australia Heritage Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: light dark;
      --bg-primary: rgba(255,255,255,0.92);
      --bg-card: #ffffff;
      --bg-hover: #f5f5f7;
      --bg-input: #ffffff;
      --bg-preview: #f0f0f2;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #aeaeb2;
      --border: rgba(0,0,0,0.08);
      --border-input: rgba(0,0,0,0.12);
      --shadow: 0 1px 6px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.1);
      --accent: #0071e3;
      --accent-bg: rgba(0,113,227,0.08);
      --popup-bg: #ffffff;
      --link-border: rgba(0,0,0,0.2);
      --link-hover-bg: #f5f5f7;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: rgba(28,28,30,0.92);
        --bg-card: #2c2c2e;
        --bg-hover: #3a3a3c;
        --bg-input: #2c2c2e;
        --bg-preview: #3a3a3c;
        --text-primary: #f5f5f7;
        --text-secondary: #98989d;
        --text-tertiary: #636366;
        --border: rgba(255,255,255,0.08);
        --border-input: rgba(255,255,255,0.12);
        --shadow: 0 1px 6px rgba(0,0,0,0.3);
        --shadow-lg: 0 4px 24px rgba(0,0,0,0.4);
        --accent: #0a84ff;
        --accent-bg: rgba(10,132,255,0.15);
        --popup-bg: #2c2c2e;
        --link-border: rgba(255,255,255,0.2);
        --link-hover-bg: #3a3a3c;
      }
    }

    [data-theme="dark"] {
      --bg-primary: rgba(28,28,30,0.92);
      --bg-card: #2c2c2e;
      --bg-hover: #3a3a3c;
      --bg-input: #2c2c2e;
      --bg-preview: #3a3a3c;
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --text-tertiary: #636366;
      --border: rgba(255,255,255,0.08);
      --border-input: rgba(255,255,255,0.12);
      --shadow: 0 1px 6px rgba(0,0,0,0.3);
      --shadow-lg: 0 4px 24px rgba(0,0,0,0.4);
      --accent: #0a84ff;
      --accent-bg: rgba(10,132,255,0.15);
      --popup-bg: #2c2c2e;
      --link-border: rgba(255,255,255,0.2);
      --link-hover-bg: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    /* Sidebar */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100vh;
      background: var(--bg-primary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
      overflow-y: auto;
      padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-left: calc(16px + env(safe-area-inset-left));
      border-right: 1px solid var(--border);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar.collapsed {
      transform: translateX(-320px);
    }

    #sidebar h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
      color: var(--text-primary);
    }

    #sidebar .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* Search */
    #search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-input);
      border-radius: 10px;
      font-size: 14px;
      background: var(--bg-input);
      color: var(--text-primary);
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search-input::placeholder {
      color: var(--text-tertiary);
    }

    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }

    /* Museum list */
    .museum-list-section h3 {
      font-size: 11px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    #museum-count {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }

    .museum-item {
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
    }

    .museum-item:last-child {
      border-bottom: none;
    }

    .museum-item:hover {
      background: var(--bg-hover);
    }

    .museum-item .museum-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .museum-item .museum-address {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .museum-item .museum-region-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .museum-item .museum-region {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* Toggle button */
    #toggle-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1001;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--bg-primary);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-primary);
    }

    #sidebar:not(.collapsed) ~ #toggle-btn {
      left: 332px;
    }

    /* Top-right controls */
    #top-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1001;
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border: 1px solid var(--border-input);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg-primary);
      color: var(--text-secondary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-tertiary);
    }

    #lang-btn {
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    #theme-btn {
      font-size: 16px;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      padding: 0 !important;
      overflow: hidden;
      background: var(--popup-bg) !important;
      box-shadow: var(--shadow-lg) !important;
    }

    .leaflet-popup-tip {
      background: var(--popup-bg) !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      min-width: 260px;
    }

    .popup-card {
      padding: 16px;
    }

    .popup-card .popup-region {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      margin-bottom: 10px;
    }

    .popup-card h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .popup-card .popup-address {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .popup-card .popup-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .popup-card .popup-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--link-border);
      border-radius: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 16px;
      transition: all 0.2s;
    }

    .popup-card .popup-link:hover {
      background: var(--link-hover-bg);
    }

    /* Preview Image */
    .popup-preview {
      width: 100%;
      height: 160px;
      background: var(--bg-preview);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .popup-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-loading {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Leaflet dark mode overrides */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .leaflet-control-zoom a {
        background: var(--bg-primary) !important;
        color: var(--text-primary) !important;
        border-color: var(--border) !important;
      }
      :root:not([data-theme="light"]) .leaflet-popup-close-button {
        color: var(--text-secondary) !important;
      }
      :root:not([data-theme="light"]) .leaflet-control-attribution {
        background: rgba(28,28,30,0.7) !important;
        color: var(--text-tertiary) !important;
      }
      :root:not([data-theme="light"]) .leaflet-control-attribution a {
        color: var(--text-secondary) !important;
      }
    }

    [data-theme="dark"] .leaflet-control-zoom a {
      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      border-color: var(--border) !important;
    }
    [data-theme="dark"] .leaflet-popup-close-button {
      color: var(--text-secondary) !important;
    }
    [data-theme="dark"] .leaflet-control-attribution {
      background: rgba(28,28,30,0.7) !important;
      color: var(--text-tertiary) !important;
    }
    [data-theme="dark"] .leaflet-control-attribution a {
      color: var(--text-secondary) !important;
    }

    /* Mobile: Bottom Sheet */
    @media (max-width: 768px) {
      #sidebar {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        max-height: 65vh;
        border-right: none;
        border-top: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
        padding: 0 16px 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        box-shadow: 0 -2px 20px rgba(0,0,0,0.1);
      }

      #sidebar::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--text-tertiary);
        margin: 8px auto 16px;
        opacity: 0.5;
      }

      #sidebar.collapsed {
        transform: translateY(100%);
      }

      #sidebar:not(.collapsed) ~ #toggle-btn {
        left: 16px;
        bottom: calc(65vh + 8px);
        top: auto;
      }

      #toggle-btn {
        top: auto;
        bottom: 16px;
        left: 16px;
      }

      .popup-card .popup-desc {
        max-height: 80px;
        overflow-y: auto;
      }

      .ctrl-btn {
        height: 40px;
        min-width: 40px;
        font-size: 14px;
      }

      #lang-btn {
        font-size: 13px;
      }

      .leaflet-popup-content {
        min-width: 220px;
        max-width: calc(100vw - 48px);
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="top-controls">
    <button id="lang-btn" class="ctrl-btn" title="Switch language">中文</button>
    <button id="theme-btn" class="ctrl-btn" title="Toggle theme">☀️</button>
  </div>

  <div id="sidebar">
    <h1>Victoria Heritage</h1>
    <p class="subtitle">Historic Buildings of Victoria, Australia</p>

    <input type="text" id="search-input" placeholder="Search museums & historic places..." />

    <div class="museum-list-section">
      <h3>Museums</h3>
      <div id="museum-count"></div>
      <div id="museum-list"></div>
    </div>
  </div>

  <button id="toggle-btn" title="Toggle sidebar">&#9776;</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Language state
    let currentLanguage = 'en';
    let currentOpenMarker = null;

    // Theme state
    let themeMode = localStorage.getItem('theme') || 'system';

    function applyTheme(mode) {
      const root = document.documentElement;
      const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');

      // Swap map tiles
      if (typeof map !== 'undefined' && currentTileLayer) {
        map.removeLayer(currentTileLayer);
        currentTileLayer = isDark ? darkTiles : lightTiles;
        currentTileLayer.addTo(map);
      }

      // Update button icon
      const btn = document.getElementById('theme-btn');
      if (mode === 'light') btn.textContent = '☀️';
      else if (mode === 'dark') btn.textContent = '🌙';
      else btn.textContent = isDark ? '🌙' : '☀️';
    }

    document.getElementById('theme-btn').addEventListener('click', () => {
      const modes = ['system', 'light', 'dark'];
      const next = modes[(modes.indexOf(themeMode) + 1) % modes.length];
      themeMode = next;
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // Language switcher
    document.getElementById('lang-btn').addEventListener('click', function() {
      currentLanguage = currentLanguage === 'en' ? 'zh' : 'en';
      this.textContent = currentLanguage === 'en' ? '中文' : 'EN';
      refreshUI();
    });

    function refreshUI() {
      // Update sidebar title and label
      document.querySelector('#sidebar h1').textContent = currentLanguage === 'en' ? 'Victoria Heritage' : 'Australia Heritage';
      document.querySelector('#sidebar .subtitle').textContent = currentLanguage === 'en' ? 'Historic Buildings of Victoria, Australia' : '澳大利亚历史建筑与博物馆地图';
      document.querySelector('#search-input').placeholder = currentLanguage === 'en' ? 'Search museums & historic places...' : 'Search museums & historic places...';
      document.querySelector('#museum-count').textContent = currentLanguage === 'en' ? `${document.querySelector('#museum-list').children.length} museums` : `${document.querySelector('#museum-list').children.length} of ${museums.length} museums`;
      document.querySelector('.museum-list-section h3').textContent = currentLanguage === 'en' ? 'Museums' : 'Museums';
      
      // Close and reopen any open popups to update description
      if (currentOpenMarker) {
        currentOpenMarker.closePopup();
        // Reopen immediately with updated language
        setTimeout(() => {
          if (currentOpenMarker) {
            currentOpenMarker.openPopup();
          }
        }, 50);
      }
    }
</script>

  {name:"Gulf Station",lat:-37.6880,lng:145.4430,address:"1029 Melba Highway, Yarra Glen VIC 3775",description:{zh:"维多利亚州保存最完整的早期先驱农场之一，展示1850年代至1940年代的乡村农业生活。",en:"One of Victoria's best-preserved early pioneer farms, showcasing rural agricultural life from the 1850s to 1940s."},link:"https://www.nationaltrust.org.au/places/gulf-station/",region:"VIC",customImage:"images/16-gulf-station.jpg"},
  {name:"McCrae Homestead",lat:-38.3528,lng:144.9205,address:"11 Beverley Road, McCrae VIC 3938",description:{zh:"1844年建造的石灰岩住宅，是维多利亚州现存最古老的宅基地之一，采用独特的苏格兰风格设计。",en:"A limestone residence built in 1844, one of Victoria's oldest homesteads, featuring unique Scottish-style design."},link:"https://www.nationaltrust.org.au/places/mccrae-homestead/",region:"VIC",customImage:"images/17-mccrae.jpg"},
  {name:"Mooramong",lat:-37.6860,lng:143.3390,address:"Skipton-Lismore Road, Skipton VIC 3360",description:{zh:"1930年代装饰艺术风格改造的历史宅基地，由好莱坞电影制片人Claude McKenzie与其妻子Doris增添了独特的时代魅力。",en:"A historic homestead renovated in 1930s Art Deco style by Hollywood film producer Claude McKenzie and his wife Doris."},link:"https://www.nationaltrust.org.au/places/mooramong/",region:"VIC",customImage:"images/18-mooramong.jpg"},
  {name:"Barwon Grange",lat:-38.1460,lng:144.3540,address:"71-73 Fernleigh Street, Newtown VIC 3220",description:{zh:"1850年代意大利风格河畔住宅，是Geelong地区唯一幸存的早期河滨别墅。",en:"An Italian-style riverside residence from the 1850s, the only surviving early riverfront villa in the Geelong district."},link:"https://www.nationaltrust.org.au/places/barwon-grange/",region:"VIC",customImage:"images/19-barwon-grange.jpg"},
  {name:"The Heights",lat:-38.1380,lng:144.3480,address:"140 Aphrasia Street, Newtown VIC 3220",description:{zh:"Geelong地区淘金热之前保存最完好的住宅，维多利亚州最大的预制铁房屋，建于1850年代。",en:"Geelong's best-preserved pre-gold rush residence, Victoria's largest prefabricated iron house, built in the 1850s."},link:"https://www.nationaltrust.org.au/places/the-heights/",region:"VIC",customImage:"images/20-the-heights.jpg"},
  {name:"Portable Iron Houses",lat:-37.833859099462515,lng:144.95329529393595,address:"399 Coventry Street, South Melbourne VIC 3205",description:{zh:"三栋1850年代淘金热时期从英国运来的预制铁屋，是极早期预制建筑的罕见实物例证。",en:"Three prefabricated iron houses imported from England during the 1850s gold rush, rare examples of early prefabrication."},link:"https://www.nationaltrust.org.au/places/portable-iron-houses/",region:"VIC",customImage:"images/21-portable-iron.jpg"},
  {name:"Rupertswood Mansion",lat:-37.5740,lng:144.7260,address:"Rupertswood Boulevard, Sunbury VIC 3429",description:{zh:"1870年代意大利风格豪宅，因与板球'灰烬杯'(The Ashes)起源故事密切相关而闻名于世。",en:"An Italian-style mansion from the 1870s, famous for its connection to the origins of cricket's coveted 'The Ashes'."},link:"https://collections.museumsvictoria.com.au/articles/12361",region:"VIC",customImage:"images/22-rupertswood.jpg"},
  {name:"Mont De Lancey Heritage Homestead",lat:-37.7870,lng:145.4310,address:"71 Wellington Street, Wandin North VIC 3139",description:{zh:"1880年代先驱者宅基地，展示Yarra Valley地区早期定居者的乡村生活和手工艺。",en:"An 1880s pioneer homestead showcasing rural life and crafts of early settlers in the Yarra Valley."},link:"https://montdelancey.org.au/",region:"VIC",customImage:"images/23-mont-de-lancey.jpg"},
  {name:"Government House Melbourne",lat:-37.827357233034604,lng:144.9770786079788,address:"Government House Drive, Melbourne VIC 3004",description:{zh:"建于1876年的意大利风格建筑，是维多利亚州总督官邸，也是澳大利亚最宏伟的政府建筑之一。",en:"Built in 1876, this Italian-style building serves as the Governor of Victoria's official residence and is one of Australia's most impressive government buildings."},link:"https://www.governor.vic.gov.au/history-government-house",region:"VIC",customImage:"images/24-govt-house.jpg"},
  {name:"Tasma Terrace (National Trust HQ)",lat:-37.8143,lng:144.9666,address:"267 Collins Street, Melbourne VIC 3000",description:{zh:"1878年建造的维多利亚时期排屋群，是墨尔本市中心仅存的此类建筑，现为澳大利亚国家信托(维州)总部。",en:"A group of Victorian terrace houses built in 1878, the only surviving example in Melbourne's CBD, now home to the National Trust's Victoria headquarters."},link:"https://www.nationaltrust.org.au/places/tasma-terrace/",region:"VIC",customImage:"images/25-tasma-terrace.jpg"},
  {name:"Kyneton Museum",lat:-37.2443,lng:144.4472,address:"67 Piper Street, Kyneton VIC 3444",description:{zh:"收藏于1856年建造的前新南威尔士银行分行建筑中。包括银行经理住宅、青石马厩、马车和历史农业设备收藏。",en:"Located in a former NSW Bank branch building from 1856, featuring the bank manager's residence, bluestone stables, carriages and historical farm equipment."},link:"https://www.mrsc.vic.gov.au/See-Do/Arts-Culture/Kyneton-Museum",region:"VIC",customImage:"images/26-kyneton.jpg"},

  // ===== New South Wales (NSW) =====
  {name:"Vaucluse House",lat:-33.8606,lng:151.2787,address:"Wentworth Road, Vaucluse NSW 2030",description:{zh:"19世纪殖民时期庄园，为政治家William Charles Wentworth的故居，拥有宏伟的建筑和历史花园。由Museums of History NSW管理。",en:"A 19th-century colonial estate, former home of statesman William Charles Wentworth, featuring grand architecture and historic gardens. Managed by Museums of History NSW."},link:"https://mhnsw.au/visit-us/vaucluse-house/",region:"NSW",customImage:"images/nsw-01-vaucluse-house.jpg"},
  {name:"Elizabeth Bay House",lat:-33.8742,lng:151.2256,address:"7 Onslow Avenue, Elizabeth Bay NSW 2011",description:{zh:"1835-1839年建造的摄政时期风格豪宅，被誉为澳大利亚殖民地建筑的最佳典范之一，拥有壮观的椭圆形大厅。",en:"A Regency-style mansion built 1835-1839, regarded as one of the finest examples of colonial architecture in Australia, with a spectacular oval saloon."},link:"https://mhnsw.au/visit-us/elizabeth-bay-house/",region:"NSW",customImage:"images/nsw-02-elizabeth-bay-house.jpg"},
  {name:"Old Government House",lat:-33.8148,lng:151.0033,address:"Parramatta Park, Pitt Street, Parramatta NSW 2150",description:{zh:"澳大利亚最古老的公共建筑，曾为早期新南威尔士州总督的官邸，位于世界遗产名录的Parramatta公园内。",en:"Australia's oldest surviving public building, former residence of early NSW Governors, located within World Heritage-listed Parramatta Park."},link:"https://www.nationaltrust.org.au/places/old-government-house/",region:"NSW",customImage:"images/nsw-03-old-govt-house.jpg"},
  {name:"Elizabeth Farm",lat:-33.8161,lng:151.0049,address:"70 Alice Street, Rosehill NSW 2142",description:{zh:"建于1793年，是澳大利亚现存最古老的欧洲人建筑，为羊毛工业先驱John Macarthur的故居。",en:"Built in 1793, the oldest surviving European building in Australia, former home of wool industry pioneer John Macarthur."},link:"https://mhnsw.au/visit-us/elizabeth-farm/",region:"NSW",customImage:"images/nsw-04-elizabeth-farm.jpg"},
  {name:"Hyde Park Barracks",lat:-33.8687,lng:151.2132,address:"Queens Square, Macquarie Street, Sydney NSW 2000",description:{zh:"联合国世界文化遗产，由流放建筑师Francis Greenway设计，展示澳大利亚殖民历史和囚犯生活。",en:"UNESCO World Heritage Site designed by convict architect Francis Greenway, showcasing Australia's colonial history and convict life."},link:"https://mhnsw.au/visit-us/hyde-park-barracks/",region:"NSW",customImage:"images/nsw-05-hyde-park-barracks.jpg"},
  {name:"Susannah Place Museum",lat:-33.8572,lng:151.2053,address:"58-64 Gloucester Street, The Rocks NSW 2000",description:{zh:"建于1844年的四栋工人阶级排屋，原汁原味地保留了150年的居住历史和悉尼工人阶级的日常生活。",en:"Four working-class terrace houses built in 1844, authentically preserving 150 years of residential history and everyday life of Sydney's working class."},link:"https://mhnsw.au/visit-us/susannah-place/",region:"NSW",customImage:"images/nsw-06-susannah-place.jpg"},
  {name:"Meroogal",lat:-34.8770,lng:150.5950,address:"78 West Street, Nowra NSW 2541",description:{zh:"建于1880年代的百年老宅，由四代女性家族成员传承保存，完整展示了从维多利亚到现代的乡村家居生活。",en:"A century-old residence from the 1880s, preserved by four generations of women, showcasing rural domestic life from the Victorian era to modern times."},link:"https://mhnsw.au/visit-us/meroogal/",region:"NSW",customImage:"images/nsw-07-meroogal.jpg"},
  {name:"Rouse Hill House & Farm",lat:-33.6803,lng:150.9062,address:"356 Annangrove Road, Rouse Hill NSW 2155",description:{zh:"跨越200年历史的家族庄园，完好保留了从殖民时期到现代的家居陈设和农场建筑。",en:"A family estate spanning 200 years of history, preserving domestic furnishings and farm buildings from the colonial period to modern times."},link:"https://mhnsw.au/visit-us/rouse-hill-estate/",region:"NSW",customImage:"images/nsw-08-rouse-hill.jpg"},
  {name:"Experiment Farm Cottage",lat:-33.8153,lng:151.0030,address:"9 Ruse Street, Harris Park NSW 2150",description:{zh:"位于澳大利亚第一个土地授予地块上的历史小屋，展示早期殖民定居者的农耕生活。由澳大利亚国家信托管理。",en:"A historic cottage on Australia's first land grant, showcasing early colonial settlers' farming life. Managed by the National Trust of Australia."},link:"https://www.nationaltrust.org.au/places/experiment-farm-cottage/",region:"NSW",customImage:"images/nsw-09-experiment-farm.jpg"},
  {name:"Everglades House & Gardens",lat:-33.7132,lng:150.3317,address:"37 Everglades Avenue, Leura NSW 2780",description:{zh:"蓝山上1930年代装饰艺术风格的宅邸，由丹麦景观设计师Paul Sorensen设计的壮丽梯田花园。",en:"A 1930s Art Deco mansion in the Blue Mountains with magnificent terraced gardens designed by Danish landscape designer Paul Sorensen."},link:"https://www.nationaltrust.org.au/places/everglades-house-gardens/",region:"NSW",customImage:"images/nsw-10-everglades.jpg"},
  {name:"Saumarez Homestead",lat:-30.5040,lng:151.6280,address:"230 Saumarez Road, Armidale NSW 2350",description:{zh:"新英格兰高地30间房的爱德华时期庄园豪宅（1888-1906年建），展示澳大利亚内陆牧羊业百年历史。",en:"A 30-room Edwardian mansion (1888-1906) in the New England Highlands, showcasing a century of Australian pastoral sheep farming history."},link:"https://www.nationaltrust.org.au/places/saumarez-homestead/",region:"NSW",customImage:"images/nsw-12-saumarez.jpg"},
  {name:"Norman Lindsay Gallery & Museum",lat:-33.7109,lng:150.4658,address:"14 Norman Lindsay Crescent, Faulconbridge NSW 2776",description:{zh:"澳大利亚著名艺术家Norman Lindsay的故居和工作室，展示其画作、雕塑和文学作品。",en:"Home and studio of renowned Australian artist Norman Lindsay, displaying his paintings, sculptures and literary works."},link:"https://www.normanlindsay.com.au/",region:"NSW",customImage:"images/nsw-13-norman-lindsay.jpg"},
  {name:"Miss Porter's House",lat:-32.9273,lng:151.7767,address:"55 King Street, Newcastle West NSW 2302",description:{zh:"建于1909年的爱德华时期排屋，由Porter家族三代女性保存，展示20世纪纽卡斯尔的家居生活。",en:"An Edwardian terrace house built in 1909, preserved by three generations of Porter women, showcasing 20th-century domestic life in Newcastle."},link:"https://www.nationaltrust.org.au/places/miss-porters-house/",region:"NSW",customImage:"images/nsw-14-miss-porters.jpg"},
  {name:"Rose Seidler House",lat:-33.7465,lng:151.1175,address:"71 Clissold Avenue, Wahroonga NSW 2076",description:{zh:"1948-1950年由著名建筑师Harry Seidler为其父母设计的现代主义住宅，是澳大利亚现代建筑的里程碑。",en:"A modernist residence designed 1948-1950 by renowned architect Harry Seidler for his parents, a milestone in Australian modern architecture."},link:"https://mhnsw.au/visit-us/rose-seidler-house/",region:"NSW",customImage:"images/nsw-15-rose-seidler.jpg"},
  {name:"Government House Sydney",lat:-33.8562,lng:151.2150,address:"Macquarie Street, Sydney NSW 2000",description:{zh:"新南威尔士州总督官邸，建于1845年的哥特复兴式建筑，提供导览参观，展示州级历史收藏。",en:"The official residence of the Governor of NSW, a Gothic Revival building from 1845, offering guided tours and displaying state historical collections."},link:"https://www.governor.nsw.gov.au/government-house/",region:"NSW",customImage:"images/nsw-16-govt-house-sydney.jpg"},
  {name:"Lindesay",lat:-33.8641,lng:151.2240,address:"1 Carthona Avenue, Darling Point NSW 2027",description:{zh:"建于1834年的摄政时期砂岩豪宅，是悉尼最早的海港景致住宅之一，现为国家信托所有。",en:"A Regency-era sandstone mansion built in 1834, one of Sydney's earliest harbour-view residences, now owned by the National Trust."},link:"https://www.nationaltrust.org.au/places/lindesay/",region:"NSW",customImage:"images/nsw-17-lindesay.jpg"},
  {name:"Grossmann House",lat:-32.7710,lng:151.8450,address:"71 Church Street, Maitland NSW 2320",description:{zh:"1870年代维多利亚哥特式联排别墅，由商人Isaac Beckett建造，展示猎人谷地区殖民时期商人家庭生活。",en:"A Victorian Gothic townhouse from the 1870s, built by merchant Isaac Beckett, showcasing colonial-era merchant family life in the Hunter Valley."},link:"https://www.nationaltrust.org.au/places/grossmann-brough-house/",region:"NSW",customImage:"images/nsw-19-grossmann-house.jpg"},

  // ===== South Australia (SA) =====
  {name:"Ayers House",lat:-34.9210,lng:138.6091,address:"288 North Terrace, Adelaide SA 5000",description:{zh:"南澳早期殖民者Sir Henry Ayers故居，约1846年起建，是南澳建筑与殖民历史的杰出典范。",en:"Former home of Sir Henry Ayers, an influential early colonist. This exceptional example of South Australian architecture dates from the 1840s, managed by the National Trust."},link:"https://www.nationaltrust.org.au/places/ayers-house-2/",region:"SA",customImage:"images/sa-01-ayers-house.jpg"},
  {name:"Carrick Hill",lat:-35.0068,lng:138.6370,address:"46 Carrick Hill Drive, Springfield SA 5062",description:{zh:"1939年建成的英式庄园豪宅，占地百英亩，是澳大利亚保存最完整的时代豪宅之一。",en:"Set in a 100-acre estate in the Adelaide foothills, Carrick Hill (1939) is Australia's most intact period mansion with spectacular views stretching to the ocean."},link:"https://www.carrickhill.sa.gov.au/",region:"SA",customImage:"images/sa-02-carrick-hill.jpg"},
  {name:"Beaumont House",lat:-34.9497,lng:138.6604,address:"631 Glynburn Road, Beaumont SA 5066",description:{zh:"1849年建成，首任圣公会阿德莱德主教Augustus Short故居，具有独特地中海风格建筑。",en:"Built in 1849, Beaumont House was home to the first Anglican Bishop of Adelaide, Bishop Augustus Short, and later Sir Samuel Davenport. Features distinctive Mediterranean character."},link:"https://www.nationaltrust.org.au/places/beaumont-house/",region:"SA",customImage:"images/sa-03-beaumont-house.jpg"},
  {name:"Martindale Hall",lat:-33.9480,lng:138.6900,address:"Manoora Road, Mintaro SA 5415",description:{zh:"1879年建造的乔治亚风格乡间大宅，拥有32个房间，曾为电影《悬崖上的野餐》取景地。",en:"A grand 32-room Georgian-style country mansion built in 1879 in the Clare Valley. Featured in the film 'Picnic at Hanging Rock'. Now a heritage conservation park."},link:"https://martindalehall.com.au/",region:"SA",customImage:"images/sa-04-martindale-hall.jpg"},
  {name:"Collingrove Homestead",lat:-34.5437,lng:139.0780,address:"Eden Valley Road, Angaston SA 5353",description:{zh:"1856年始建的Angas家族庄园，展示早期先驱者如何创造独特的澳大利亚田园建筑风格。",en:"Commenced in 1856, Collingrove was the Angas family home in the Barossa Valley, a fine example of how pioneers created a new Australian architecture. Bequeathed to National Trust in 1976."},link:"https://www.nationaltrust.org.au/places/collingrove-homestead/",region:"SA",customImage:"images/sa-05-collingrove.jpg"},
  {name:"The Cedars (Hans Heysen's Home)",lat:-35.0207,lng:138.8070,address:"68 Heysen Road, Hahndorf SA 5245",description:{zh:"澳大利亚著名风景画家Hans Heysen故居及画室，160英亩历史庄园，保存完整的艺术家之家。",en:"Historic 160-acre property in Hahndorf, home and studio of renowned Australian landscape artist Sir Hans Heysen (1877-1968) and his daughter Nora Heysen."},link:"https://heysen.org.au/",region:"SA",customImage:"images/sa-06-the-cedars.jpg"},
  {name:"Adelaide Gaol",lat:-34.9110,lng:138.5780,address:"18 Gaol Road, Adelaide SA 5000",description:{zh:"南澳最古老的殖民监狱，建于1841年，运营至1988年，现为历史博物馆对外开放。",en:"South Australia's oldest colonial prison, operational from 1841 to 1988. Now a heritage museum offering self-guided and guided tours exploring convict history and prison life."},link:"https://www.adelaidegaol.sa.gov.au/",region:"SA",customImage:"images/sa-07-adelaide-gaol.jpg"},
  {name:"Migration Museum",lat:-34.9197,lng:138.6022,address:"82 Kintore Avenue, Adelaide SA 5000",description:{zh:"展示南澳移民历史的博物馆，位于前贫民收容所旧址，讲述多元文化移民故事，免费入场。",en:"Located on the site of the former Destitute Asylum, the Migration Museum tells the stories of the diverse peoples who have made South Australia home. Free entry."},link:"https://migration.history.sa.gov.au/",region:"SA",customImage:"images/sa-08-migration-museum.jpg"},
  {name:"South Australian Museum",lat:-34.9211,lng:138.6010,address:"North Terrace, Adelaide SA 5000",description:{zh:"南澳最大博物馆，拥有世界上最全面的澳大利亚原住民文化藏品，超400万件展品，免费入场。",en:"One of Australia's most visited museums with over four million specimens, holding the world's most comprehensive collection of Australian Aboriginal cultural material. Free entry."},link:"https://www.samuseum.sa.gov.au/",region:"SA",customImage:"images/sa-09-sa-museum.jpg"},
  {name:"South Australian Maritime Museum",lat:-34.8430,lng:138.5063,address:"126 Lipson Street, Port Adelaide SA 5015",description:{zh:"南澳海事博物馆，位于Port Adelaide历史港区，展示航海历史、沉船文物和港口文化。",en:"Located in historic Port Adelaide, the Maritime Museum tells the story of South Australia's maritime heritage, featuring historic vessels, shipwreck artefacts and port history."},link:"https://maritime.history.sa.gov.au/",region:"SA",customImage:"images/sa-10-maritime-museum.jpg"},
  {name:"Sevenhill Cellars",lat:-33.9300,lng:138.6160,address:"111 College Road, Sevenhill SA 5453",description:{zh:"Clare Valley最古老酒庄，1851年由耶稣会修士创建，拥有历史酒窖和圣阿洛伊修斯教堂。",en:"The first winery built in the Clare Valley, established by Jesuit priests in 1851. Features a historic cellar door and the Church of St Aloysius."},link:"https://www.sevenhill.com.au/",region:"SA",customImage:"images/sa-11-sevenhill.jpg"},
  {name:"Burra Heritage Town",lat:-33.6840,lng:138.9370,address:"2 Market Square, Burra SA 5417",description:{zh:"1845年发现铜矿后兴起的遗产小镇，保留大量康沃尔矿工时期建筑，列入国家遗产名录。",en:"A National Heritage-listed mining town that boomed after copper was discovered in 1845. Preserves extensive Cornish mining heritage including miners' cottages, dugouts and historic buildings."},link:"https://visitburra.com.au/",region:"SA",customImage:"images/sa-12-burra.jpg"},
  {name:"Moonta Mines National Heritage Place",lat:-34.0761,lng:137.6063,address:"Verran Terrace, Moonta Mines SA 5558",description:{zh:"国家遗产名录铜矿遗址，1861年起由康沃尔矿工开采，含博物馆和矿工小屋等多处遗迹。",en:"A National Heritage-listed copper mining precinct worked by Cornish miners from 1861-1923. Includes the Moonta Mines Museum, miners' cottage, heritage garden and tourist railway."},link:"https://www.nationaltrust.org.au/moontaminesnationalheritage/",region:"SA",customImage:"images/sa-13-moonta-mines.jpg"},
  {name:"Stangate House and Garden",lat:-35.0155,lng:138.7318,address:"3 Edgeware Road, Aldgate SA 5154",description:{zh:"1937年设计建造的阿德莱德山庄园，拥有著名园艺师Elsie Cornish设计的花园和百年橡树。",en:"Set in the Adelaide Hills, built from 1937 plans. Features gardens designed by Elsie Cornish, home to one of Australia's largest oak trees and an International Camellia Garden of Excellence."},link:"https://www.nationaltrust.org.au/places/stangate-house-and-garden/",region:"SA",customImage:"images/sa-14-stangate.jpg"},
  {name:"Willunga Courthouse Museum",lat:-35.2747,lng:138.5606,address:"61 High Street, Willunga SA 5172",description:{zh:"1855至1872年分阶段建成的遗产法院建筑群，含牢房和马厩，现为地区历史博物馆。",en:"Heritage-listed courthouse complex built from 1855 to 1872, initially used as a female immigration depot. Now a museum with authentic courtroom displays, managed by National Trust."},link:"https://www.nationaltrust.org.au/places/willunga-courthouse-museum/",region:"SA",customImage:"images/sa-15-willunga-courthouse.jpg"},

  // ===== Queensland (QLD) =====
  {name:"Newstead House",lat:-27.4416,lng:153.0500,address:"Breakfast Creek Road, Newstead QLD 4006",description:{zh:"布里斯班最古老的现存住宅（1846年建），曾为政府官邸，现为殖民时期生活博物馆，免费入场。",en:"Brisbane's oldest surviving residence, built in 1846. Served as Government House and now a museum showcasing colonial life. Free entry."},link:"https://www.newsteadhouse.com.au/",region:"QLD",customImage:"images/qld-01-newstead-house.jpg"},
  {name:"Commissariat Store",lat:-27.4700,lng:153.0210,address:"115 William Street, Brisbane QLD 4000",description:{zh:"布里斯班最古老的建筑之一（1829年建），由囚犯建造的殖民仓库，现为皇家历史学会博物馆。",en:"One of Brisbane's oldest buildings, built by convict labour in 1829 as a government store. Now home to the Royal Historical Society of Queensland museum."},link:"https://www.commissariatstore.org.au/",region:"QLD",customImage:"images/qld-02-commissariat-store.jpg"},
  {name:"Customs House Brisbane",lat:-27.4599,lng:153.0344,address:"399 Queen Street, Brisbane QLD 4000",description:{zh:"1889年建成的维多利亚时代宏伟海关大楼，拥有标志性铜穹顶，现为文化中心和餐厅。",en:"A magnificent Victorian-era customs building completed in 1889, featuring an iconic copper dome. Now a cultural centre and restaurant managed by the University of Queensland."},link:"https://www.customshouse.com.au/",region:"QLD",customImage:"images/qld-03-customs-house.jpg"},
  {name:"Miegunyah House",lat:-27.4520,lng:153.0320,address:"35 Jordan Terrace, Bowen Hills QLD 4006",description:{zh:"1886年建造的维多利亚时代精美木结构住宅，展示19世纪布里斯班上流社会家庭生活。",en:"An elegant Victorian timber residence built in 1886, showcasing upper-class domestic life in 19th-century Brisbane. Managed by the Queensland Women's Historical Association."},link:"http://www.miegunyah.org/",region:"QLD",customImage:"images/qld-04-miegunyah.jpg"},
  {name:"Wolston House",lat:-27.5800,lng:152.9420,address:"223 Grindle Road, Wacol QLD 4076",description:{zh:"昆士兰最古老的幸存住宅之一（1852年建），由Dr. Stephen Simpson建造的殖民时期农庄。",en:"One of Queensland's oldest surviving residences, built in 1852 by Dr. Stephen Simpson. A fine example of colonial pastoral homestead architecture."},link:"https://www.nationaltrust.org.au/places/wolston-house/",region:"QLD",customImage:"images/qld-05-wolston-house.jpg"},
  {name:"Workshops Rail Museum",lat:-27.6109,lng:152.7603,address:"North Street, North Ipswich QLD 4305",description:{zh:"位于历史悠久的北伊普斯维奇铁路工场，展示昆士兰铁路历史，包括蒸汽机车和互动展览。",en:"Located in the historic North Ipswich Railway Workshops, this Queensland Museum venue showcases the state's railway heritage with steam locomotives and interactive exhibits."},link:"https://www.qm.qld.gov.au/workshops",region:"QLD",customImage:"images/qld-06-workshops-rail.jpg"},
  {name:"Cobb+Co Museum",lat:-27.5630,lng:151.9530,address:"27 Lindsay Street, Toowoomba QLD 4350",description:{zh:"国家马车博物馆，展示澳大利亚最全面的马车藏品，讲述内陆交通和先驱者生活历史。",en:"Australia's National Carriage Museum housing the country's finest collection of horse-drawn vehicles. Tells the story of inland transport and pioneer life."},link:"https://www.cobbandco.qm.qld.gov.au/",region:"QLD",customImage:"images/qld-07-cobb-co.jpg"},
  {name:"Royal Bull's Head Inn",lat:-27.5598,lng:151.9546,address:"5 Russell Street, Drayton QLD 4350",description:{zh:"昆士兰最古老的旅馆之一（1859年建），曾为驿站和酒馆，展示达令唐斯早期定居历史。",en:"One of Queensland's oldest inns, built in 1859 as a staging post. Showcases the early settlement history of the Darling Downs region."},link:"https://www.nationaltrust.org.au/places/royal-bulls-head-inn/",region:"QLD",customImage:"images/qld-08-bulls-head.jpg"},
  {name:"Jondaryan Woolshed",lat:-27.3517,lng:151.5061,address:"312 Jondaryan-Evanslea Road, Jondaryan QLD 4403",description:{zh:"1859年建成的大型羊毛棚，澳大利亚最古老的之一，展示昆士兰羊毛产业和先驱者乡村生活。",en:"Built in 1859, one of Australia's oldest and largest woolsheds. A working heritage complex showcasing Queensland's pastoral and pioneering history."},link:"https://www.jondaryanwoolshed.com.au/",region:"QLD",customImage:"images/qld-09-jondaryan.jpg"},
  {name:"Jimbour House",lat:-27.0600,lng:151.2300,address:"294 Jimbour Station Road, Jimbour QLD 4406",description:{zh:"达令唐斯最宏伟的砂岩豪宅（1870年代建），古典复兴风格乡间庄园，定期向公众开放。",en:"The grandest sandstone mansion on the Darling Downs, built in the 1870s in Classical Revival style. A grand pastoral estate open for tours and events."},link:"https://www.jimbour.com/",region:"QLD",customImage:"images/qld-10-jimbour.jpg"},
  {name:"Hou Wang Temple",lat:-17.2678,lng:145.4765,address:"86 Herberton Road, Atherton QLD 4883",description:{zh:"澳大利亚仅存的木质铁皮华人庙宇（1903年建），由锡矿时代华人移民建造，展示华人文化遗产。",en:"Australia's only surviving timber and corrugated iron Chinese temple, built in 1903 by Chinese migrants during the tin mining era. A rare cultural heritage site."},link:"https://www.nationaltrust.org.au/places/hou-wang-temple/",region:"QLD",customImage:"images/qld-11-hou-wang.jpg"},
  {name:"Brennan & Geraghty's Store",lat:-17.5350,lng:145.9740,address:"64 Morgan Street, Innisfail QLD 4860",description:{zh:"1907年建造的昆士兰遗产店铺，保存了20世纪初北昆士兰乡村商店的原貌，由国民信托管理。",en:"A 1907 heritage-listed store preserving the authentic atmosphere of an early 20th-century North Queensland country shop. Managed by the National Trust."},link:"https://www.nationaltrust.org.au/places/brennan-geraghtys-store/",region:"QLD",customImage:"images/qld-12-brennan-store.jpg"},
  {name:"Archer Park Rail Museum",lat:-23.3770,lng:150.5060,address:"Denison Street, Rockhampton QLD 4700",description:{zh:"位于1899年历史火车站内的铁路博物馆，拥有罕见的Purrey蒸汽电车，展示中昆士兰铁路遗产。",en:"A rail museum in an 1899 heritage station featuring a rare Purrey steam tram, one of only two operating in the world. Showcases Central Queensland's railway heritage."},link:"https://www.archerpark.com.au/",region:"QLD",customImage:"images/qld-13-archer-park.jpg"},
  {name:"Abbey Museum of Art and Archaeology",lat:-27.0856,lng:152.9606,address:"1-63 The Abbey Place, Caboolture QLD 4510",description:{zh:"收藏跨越50万年人类文明史的艺术与考古文物，包括古埃及、罗马和中世纪藏品。",en:"Houses a remarkable collection of art and archaeological artefacts spanning 500,000 years of human civilisation, including ancient Egyptian, Roman and medieval items."},link:"https://www.abbeymuseum.com.au/",region:"QLD",customImage:"images/qld-14-abbey-museum.jpg"},
  {name:"Fernberg (Government House)",lat:-27.4630,lng:152.9930,address:"168 Fernberg Road, Paddington QLD 4064",description:{zh:"昆士兰州总督官邸，建于1865年，定期向公众开放参观宏伟建筑和精美花园。",en:"The official residence of the Governor of Queensland, built in 1865. Periodically open to the public to view its grand architecture and beautiful gardens."},link:"https://www.govhouse.qld.gov.au/",region:"QLD",customImage:"images/qld-15-fernberg.jpg"},

  // ===== Western Australia (WA) =====
  {name:"Fremantle Prison",lat:-32.0555,lng:115.7529,address:"1 The Terrace, Fremantle WA 6160",description:{zh:"世界遗产名录的囚犯遗址，建于1850年代，是西澳最大的囚犯建造建筑群，提供多种导览包括夜间隧道探险。",en:"A UNESCO World Heritage convict site built in the 1850s. Western Australia's largest convict-built structure, offering guided tours including night-time tunnel adventures."},link:"https://fremantleprison.com.au/",region:"WA",customImage:"images/wa-01-fremantle-prison.jpg"},
  {name:"The Perth Mint",lat:-31.9600,lng:115.8685,address:"310 Hay Street, East Perth WA 6004",description:{zh:"建于1899年的历史造币厂，是世界上仍在运营的最古老造币厂之一，可观看黄金熔铸和参观金库。",en:"A historic mint built in 1899, one of the oldest operating mints in the world. Watch gold pouring demonstrations and visit the original vault."},link:"https://www.perthmint.com/",region:"WA",customImage:"images/wa-02-perth-mint.jpg"},
  {name:"Fremantle Arts Centre",lat:-32.0525,lng:115.7524,address:"1 Finnerty Street, Fremantle WA 6160",description:{zh:"建于1860年代的哥特式石灰岩建筑，原为精神病院，现为西澳重要的当代艺术和文化中心。",en:"A Gothic-style limestone building from the 1860s, originally a lunatic asylum. Now a leading contemporary arts and cultural centre in Western Australia."},link:"https://www.fremantle.wa.gov.au/fac",region:"WA",customImage:"images/wa-03-fremantle-arts.jpg"},
  {name:"Woodbridge House",lat:-31.9060,lng:115.9490,address:"70 Daylesford Road, Bassendean WA 6054",description:{zh:"1885年为政治家Charles Harper建造的维多利亚风格豪宅，坐落在天鹅河畔，展示19世纪西澳乡绅生活。",en:"An 1885 Victorian mansion built for politician Charles Harper, set on the banks of the Swan River. Showcases 19th-century Western Australian gentry life."},link:"https://www.nationaltrust.org.au/places/woodbridge/",region:"WA",customImage:"images/wa-04-woodbridge.jpg"},
  {name:"Samson House",lat:-32.0540,lng:115.7490,address:"61 Ellen Street, Fremantle WA 6160",description:{zh:"1888年建造的爱德华时代住宅，Samson家族在此居住近一个世纪，保存了原始家具和个人物品。",en:"An 1888 Edwardian residence where the Samson family lived for nearly a century. Preserves original furnishings and personal belongings."},link:"https://www.nationaltrust.org.au/places/samson-house/",region:"WA",customImage:"images/wa-05-samson-house.jpg"},
  {name:"Old Farm Strawberry Hill",lat:-35.0168,lng:117.8900,address:"174 Middleton Road, Albany WA 6330",description:{zh:"西澳最古老的农庄（1827年建），原为Albany政府驻官住所，见证了欧洲人在西澳最早的定居历史。",en:"The oldest farm in Western Australia (est. 1827), originally the Government Resident's home in Albany. Witness to the earliest European settlement in WA."},link:"https://www.nationaltrust.org.au/places/strawberry-hill/",region:"WA",customImage:"images/wa-06-strawberry-hill.jpg"},
  {name:"Old Perth Observatory",lat:-31.9610,lng:115.8590,address:"4 Havelock Street, West Perth WA 6005",description:{zh:"建于1896年的历史天文台，曾是西澳主要的天文观测和时间校准中心，现为国民信托遗产。",en:"A historic observatory built in 1896, formerly WA's primary centre for astronomical observation and timekeeping. Now a National Trust heritage property."},link:"https://www.nationaltrust.org.au/places/the-old-observatory/",region:"WA",customImage:"images/wa-07-observatory.jpg"},
  {name:"Peninsula Farm (Tranby House)",lat:-31.9300,lng:115.8420,address:"Johnson Road, Maylands WA 6051",description:{zh:"1839年建造的殖民农庄，是珀斯地区最古老的砖砌建筑之一，见证了天鹅河谷的早期农业开发。",en:"An 1839 colonial farmhouse, one of the oldest brick buildings in the Perth area. Witness to the early agricultural development of the Swan River valley."},link:"https://www.nationaltrust.org.au/places/peninsula-farm/",region:"WA",customImage:"images/wa-08-peninsula-farm.jpg"},
  {name:"Ellensbrook",lat:-33.8400,lng:115.0100,address:"Ellensbrook Road, Margaret River WA 6285",description:{zh:"1857年建造的石砌农庄，坐落在玛格丽特河地区海岸悬崖旁，曾为原住民保护所。",en:"An 1857 stone farmhouse set near the coastal cliffs of the Margaret River region. Once served as a shelter for Aboriginal people."},link:"https://www.nationaltrust.org.au/places/ellensbrook/",region:"WA",customImage:"images/wa-09-ellensbrook.jpg"},
  {name:"East Perth Cemeteries",lat:-31.9530,lng:115.8780,address:"Bronte Street, East Perth WA 6004",description:{zh:"西澳最古老的公共墓地群（1829年起），包含犹太、天主教、新教等多个墓区，记录了殖民早期历史。",en:"WA's oldest public cemeteries (from 1829), comprising Jewish, Catholic, Protestant and other sections. Records the colony's earliest history."},link:"https://www.nationaltrust.org.au/places/east-perth-cemeteries/",region:"WA",customImage:"images/wa-10-east-perth-cem.jpg"},
  {name:"Aviation Heritage Museum",lat:-32.0044,lng:115.9651,address:"Air Force Memorial Estate, Bull Creek Drive, Bull Creek WA 6149",description:{zh:"展示澳大利亚航空历史的博物馆，收藏包括Lancaster轰炸机、Spitfire战斗机和Dakota运输机等珍贵飞机。",en:"A museum showcasing Australian aviation history, with a collection including a Lancaster bomber, Spitfire fighter and Dakota transport aircraft."},link:"https://www.raafawa.org.au/museum/",region:"WA",customImage:"images/wa-11-aviation.jpg"},
  {name:"Government House (Perth)",lat:-31.9590,lng:115.8610,address:"St Georges Terrace, Perth WA 6000",description:{zh:"西澳州总督官邸，建于1859-1864年，哥特复兴式建筑，拥有精美花园和历史建筑群。",en:"The official residence of the Governor of Western Australia, built 1859-1864 in Gothic Revival style with beautiful gardens and heritage buildings."},link:"https://www.govhouse.wa.gov.au/",region:"WA",customImage:"images/wa-12-gov-house.jpg"},
  {name:"York Town Hall & Residency Museum",lat:-31.8880,lng:116.7680,address:"81 Avon Terrace, York WA 6302",description:{zh:"位于西澳最古老内陆城镇的历史建筑群，包括1854年市政厅和殖民时期驻地，展示约克镇的开拓历史。",en:"Historic buildings in WA's oldest inland town, including the 1854 Town Hall and colonial Residency. Showcases York's pioneering history."},link:"https://www.york.wa.gov.au/",region:"WA",customImage:"images/wa-13-york.jpg"},
  {name:"Newcastle Gaol (Toodyay)",lat:-31.5540,lng:116.3690,address:"Clinton Street, Toodyay WA 6566",description:{zh:"1860年代建造的石砌监狱，是西澳内陆殖民历史的见证，现为展示当地历史和囚犯生活的博物馆。",en:"An 1860s stone gaol witnessing WA's inland colonial history. Now a museum showcasing local history and convict life."},link:"https://www.toodyay.wa.gov.au/",region:"WA",customImage:"images/wa-14-toodyay.jpg"},
  {name:"Gwalia Ghost Town & Museum",lat:-29.0040,lng:121.3480,address:"Tower Street, Gwalia WA 6440",description:{zh:"20世纪初淘金热时期的鬼镇遗址，保存了矿工住宅和赫伯特·胡佛（后来的美国总统）曾工作的矿场历史。",en:"An early 20th-century gold rush ghost town preserving miners' cottages and the history of the mine where Herbert Hoover (later US President) once worked."},link:"https://www.gwalia.org.au/",region:"WA",customImage:"images/wa-15-gwalia.jpg"},

  // ===== Northern Territory (NT) =====
  {name:"Alice Springs Telegraph Station",lat:-23.6753,lng:133.8675,address:"Herbert Heritage Drive, Alice Springs NT 0870",description:{zh:"1872年建造的历史电报站，是连接澳大利亚与世界的Overland Telegraph Line的重要中继站，也是爱丽丝泉城镇的发源地。",en:"Built in 1872 as a key relay station on the Overland Telegraph Line connecting Australia to the world. The birthplace of the town of Alice Springs."},link:"https://www.alicespringstelegraphstation.com.au/",region:"NT",customImage:"images/nt-01-telegraph.jpg"},
  {name:"Fannie Bay Gaol",lat:-12.4500,lng:130.8310,address:"5 East Point Road, Fannie Bay, Darwin NT 0820",description:{zh:"1883至1979年运营近百年的历史监狱，现为遗产博物馆，展示达尔文殖民时期司法历史，免费开放参观。",en:"A historic prison operating from 1883 to 1979 for nearly a century. Now a heritage museum showcasing Darwin's colonial-era justice history, with free admission."},link:"https://www.magnt.net.au/fannie-bay-gaol",region:"NT",customImage:"images/nt-02-fannie-bay.jpg"},
  {name:"Government House Darwin",lat:-12.4660,lng:130.8370,address:"6 Esplanade, Darwin NT 0800",description:{zh:"1870年代建造的北领地行政长官官邸，达尔文最古老的建筑之一，七角形热带殖民风格建筑，在特定开放日提供公众参观。",en:"Built in the 1870s as the official residence of the Administrator of the Northern Territory. One of Darwin's oldest buildings, featuring a distinctive tropical colonial heptagonal design."},link:"https://nt.gov.au/",region:"NT",customImage:"images/nt-03-gov-house.jpg"},
  {name:"Brown's Mart",lat:-12.4675,lng:130.8415,address:"38-46 Smith Street, Darwin NT 0800",description:{zh:"1880年代建造的历史石砌建筑，达尔文少数幸存的二战前建筑之一，曾用作矿业交易所，现为社区艺术文化场所。",en:"An 1880s historic stone building, one of Darwin's few surviving pre-WWII structures. Originally a mining exchange, now a community arts and cultural venue."},link:"https://www.brownsmart.com.au/",region:"NT",customImage:"images/nt-04-browns-mart.jpg"},
  {name:"Lyons Cottage",lat:-12.4648,lng:130.8396,address:"12 The Esplanade, Darwin NT 0800",description:{zh:"约1925年建造的达尔文最古老石砌平房之一，原名British Australian Telegraph House，幸存于1942年达尔文轰炸和1974年Cyclone Tracy。",en:"One of Darwin's oldest stone bungalows, built c.1925. Originally the British Australian Telegraph House, it survived the 1942 Bombing of Darwin and 1974 Cyclone Tracy."},link:"https://www.magnt.net.au/lyonscottage",region:"NT",customImage:"images/nt-05-lyons-cottage.jpg"},
  {name:"Adelaide House Museum",lat:-23.6975,lng:133.8815,address:"69-71 Hartley Street, Alice Springs NT 0870",description:{zh:"1926年开放的澳大利亚内陆第一家医院，由John Flynn牧师创建，独特的通风屋顶结构适应沙漠气候，是皇家飞行医生服务的起源地之一。",en:"The first hospital in inland Australia, opened in 1926. Founded by Rev. John Flynn with a unique ventilated roof design for the desert climate. A birthplace of the Royal Flying Doctor Service."},link:"https://www.nationaltrustnt.org.au/",region:"NT",customImage:"images/nt-06-adelaide-house.jpg"},
  {name:"Victoria Hotel (The Vic)",lat:-12.4620,lng:130.8426,address:"27 Smith Street Mall, Darwin NT 0800",description:{zh:"建于1890年的达尔文最古老的酒店，经历了两次世界大战和1974年Tracy飓风，是北领地重要的遗产建筑和社交地标。",en:"Darwin's oldest hotel, built in 1890. Survived both World Wars and 1974 Cyclone Tracy. An important heritage building and social landmark of the Northern Territory."},link:"https://en.wikipedia.org/wiki/Victoria_Hotel,_Darwin",region:"NT",customImage:"images/nt-07-vic-hotel.jpg"},
  {name:"Stuart Town Gaol",lat:-23.6990,lng:133.8820,address:"Parsons Street, Alice Springs NT 0870",description:{zh:"1909年建造的爱丽丝泉最古老政府建筑之一，石砌监狱展示北领地早期殖民和警务历史。",en:"Built in 1909, one of Alice Springs' oldest government buildings. A stone gaol showcasing early colonial and policing history of the Northern Territory."},link:"https://www.alicesprings.nt.gov.au/",region:"NT",customImage:"images/nt-08-stuart-gaol.jpg"},
  {name:"Burnett House",lat:-12.4621,lng:130.8425,address:"5 Burnett Place, Larrakeyah, Darwin NT 0820",description:{zh:"1938年建筑师B.C.G. Burnett设计的热带风格历史住宅，位于Myilly Point遗产区，是达尔文战前建筑的杰出代表，提供下午茶和导览参观。",en:"A tropical-style heritage residence designed by architect B.C.G. Burnett in 1938. Located in the Myilly Point heritage precinct, an outstanding example of pre-war Darwin architecture."},link:"https://www.nationaltrustnt.org.au/",region:"NT",customImage:"images/nt-09-burnett.jpg"},
  {name:"Pine Creek Heritage Precinct",lat:-13.6200,lng:131.9570,address:"Pine Creek NT 0847",description:{zh:"1871年淘金热时期的历史小镇，保存完好的19世纪建筑群包括Old Playford Club Hotel、火车站和矿长住宅。",en:"A historic town from the 1871 gold rush era. Well-preserved 19th-century buildings include the Old Playford Club Hotel, railway station and mine manager's residence."},link:"https://nt.gov.au/leisure/parks-reserves",region:"NT",customImage:"images/nt-10-pine-creek.jpg"},
  {name:"Myilly Point Heritage Precinct",lat:-12.4625,lng:130.8430,address:"Myilly Point, Larrakeyah, Darwin NT 0820",description:{zh:"达尔文罕见的战前住宅遗产区，包括Burnett House等四栋1930年代热带风格历史建筑，展示达尔文战前生活方式。",en:"A rare pre-war residential heritage precinct in Darwin, featuring four 1930s tropical-style historic houses including Burnett House. Showcases Darwin's pre-war lifestyle."},link:"https://www.nationaltrustnt.org.au/",region:"NT",customImage:"images/nt-11-myilly-point.jpg"},
  {name:"Tennant Creek Telegraph Station",lat:-19.5555,lng:134.2286,address:"Stuart Highway, Tennant Creek NT 0860",description:{zh:"1872年建成的澳大利亚陆上电报线路中继站，是连接阿德莱德和达尔文通讯的关键节点，也是Tennant Creek城镇发展的起源地。",en:"Built in 1872 as a relay station on the Australian Overland Telegraph Line, a key link connecting Adelaide to Darwin. The origin point of the town of Tennant Creek."},link:"https://en.wikipedia.org/wiki/Tennant_Creek_Telegraph_Station",region:"NT",customImage:"images/nt-12-tennant-creek.jpg"},
  {name:"Museum & Art Gallery of the NT",lat:-12.4411,lng:130.8416,address:"19 Conacher Street, Fannie Bay NT 0820",description:{zh:"北领地最大的博物馆，展示原住民艺术、自然历史和太平洋艺术收藏，包括著名的Cyclone Tracy展览。",en:"The largest museum in the Northern Territory, featuring Aboriginal art, natural history and Pacific art collections, including the famous Cyclone Tracy exhibition."},link:"https://www.magnt.net.au/",region:"NT",customImage:"images/nt-13-magnt.jpg"},

const regions = [
  { name: "VIC", color: "#16a085", fullName: "Victoria" },
  { name: "NSW", color: "#2980b9", fullName: "New South Wales" },
  { name: "QLD", color: "#e74c3c", fullName: "Queensland" },
  { name: "SA", color: "#e67e22", fullName: "South Australia" },
  { name: "WA", color: "#8e44ad", fullName: "Western Australia" },
  { name: "TAS", color: "#27ae60", fullName: "Tasmania" },
  { name: "NT", color: "#d35400", fullName: "Northern Territory" },
  { name: "ACT", color: "#2c3e50", fullName: "Australian Capital Territory" }
];

  </script>
  <script>
    // --- Map setup ---
    const map = L.map('map', {
      center: [-35.5, 148.0],
      zoom: 6,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Theme-aware tile layers
    const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19
    });

    const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19
    });

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    const savedTheme = localStorage.getItem('theme') || 'system';
    let currentTileLayer = lightTiles; // placeholder, applyTheme will set the right one
    applyTheme(savedTheme);

    prefersDark.addEventListener('change', () => {
      if (themeMode === 'system') applyTheme('system');
    });

    // --- Region color & fullName lookup ---
    const regionColorMap = {};
    const regionFullNameMap = {};
    regions.forEach(r => {
      regionColorMap[r.name] = r.color;
      regionFullNameMap[r.name] = r.fullName || r.name;
    });

    function getColor(region) {
      return regionColorMap[region] || '#999';
    }

    // --- Fetch preview image from Microlink API or Open Graph tags ---
    async function fetchPreviewImage(url, targetElement, museumData = null) {
      // First, check if museum has a custom image
      if (museumData && museumData.customImage) {
        targetElement.innerHTML = `<img src="${museumData.customImage}" alt="Preview" onerror="this.parentElement.innerHTML='Preview unavailable'">`;
        targetElement.classList.remove('preview-loading');
        return;
      }

      // Create abort controller with 8 second timeout
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        // Try Microlink API with timeout
        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`, { signal: controller.signal });
        if (response.ok) {
          const data = await response.json();
          if (data.data && data.data.image && data.data.image.url) {
            clearTimeout(timeoutId);
            const imageUrl = data.data.image.url;
            targetElement.innerHTML = `<img src="${imageUrl}" alt="Preview" onerror="this.parentElement.innerHTML='Preview unavailable'">`;
            targetElement.classList.remove('preview-loading');
            return;
          }
        }
      } catch (error) {
        console.error('Microlink API failed:', error);
      }

      // Fallback: Try to fetch Open Graph og:image from the website directly
      try {
        const pageResponse = await fetch(url, { signal: controller.signal });
        if (pageResponse.ok) {
          const pageText = await pageResponse.text();
          const ogImageMatch = pageText.match(/<meta\s+property="og:image"\s+content="([^"]+)"/);
          if (ogImageMatch && ogImageMatch[1]) {
            clearTimeout(timeoutId);
            const imageUrl = ogImageMatch[1];
            targetElement.innerHTML = `<img src="${imageUrl}" alt="Preview" onerror="this.parentElement.innerHTML='Preview unavailable'">`;
            targetElement.classList.remove('preview-loading');
            return;
          }
        }
      } catch (error) {
        console.error('Failed to fetch Open Graph image:', error);
      }

      // Additional fallback: Try using CORS proxy with separate timeout
      const proxyController = new AbortController();
      const proxyTimeoutId = setTimeout(() => proxyController.abort(), 8000);
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const pageResponse = await fetch(proxyUrl, { signal: proxyController.signal });
        if (pageResponse.ok) {
          const pageText = await pageResponse.text();
          const ogImageMatch = pageText.match(/<meta\s+property="og:image"\s+content="([^"]+)"/);
          if (ogImageMatch && ogImageMatch[1]) {
            clearTimeout(proxyTimeoutId);
            clearTimeout(timeoutId);
            const imageUrl = ogImageMatch[1];
            targetElement.innerHTML = `<img src="${imageUrl}" alt="Preview" onerror="this.parentElement.innerHTML='Preview unavailable'">`;
            targetElement.classList.remove('preview-loading');
            return;
          }
        }
      } catch (error) {
        console.error('CORS proxy failed:', error);
      }

      // If all methods fail, clear timeouts and show unavailable
      clearTimeout(timeoutId);
      clearTimeout(proxyTimeoutId);
      
      // Only update if not already updated (race condition check)
      if (targetElement.classList.contains('preview-loading')) {
        targetElement.innerHTML = 'No preview available';
        targetElement.classList.remove('preview-loading');
      }
    }

    // --- Markers ---
    const markersLayer = L.layerGroup().addTo(map);
    let allMarkers = [];

    function createCircleMarker(m) {
      const color = getColor(m.region);
      const marker = L.circleMarker([m.lat, m.lng], {
        radius: 7,
        fillColor: color,
        color: '#fff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
      });

      // Helper function to get description based on current language
      const getDescription = () => {
        if (typeof m.description === 'object') {
          return m.description[currentLanguage] || m.description.zh || m.description.en;
        }
        return m.description;
      };

      marker.bindPopup(function() {
        return `
          <div class="popup-card">
            <span class="popup-region" style="background:${color}">${regionFullNameMap[m.region] || m.region}</span>
            <h2>${m.name}</h2>
            <div class="popup-address">${m.address}</div>
            <div class="popup-preview preview-loading" data-url="${m.link}">加载中...</div>
            <div class="popup-desc">${getDescription()}</div>
            <a class="popup-link" href="${m.link}" target="_blank" rel="noopener" title="Visit Website">↗</a>
          </div>
        `;
      }, { maxWidth: 300 });

      // Load preview image when popup is opened, and track current marker
      marker.on('popupopen', () => {
        currentOpenMarker = marker; // Track this marker as currently open
        const previewDiv = document.querySelector(`[data-url="${m.link}"]`);
        if (previewDiv && !previewDiv.dataset.loaded) {
          fetchPreviewImage(m.link, previewDiv, m);
          previewDiv.dataset.loaded = 'true';
        }
      });

      // Clear tracking when popup is closed
      marker.on('popupclose', () => {
        if (currentOpenMarker === marker) {
          currentOpenMarker = null;
        }
      });

      marker.museumData = m;
      return marker;
    }

    museums.forEach(m => {
      const marker = createCircleMarker(m);
      markersLayer.addLayer(marker);
      allMarkers.push(marker);
    });

    // --- Search ---
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', () => applyFilters());

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      let visibleCount = 0;

      allMarkers.forEach(marker => {
        const m = marker.museumData;
        const searchMatch = !query || m.name.toLowerCase().includes(query) || m.address.toLowerCase().includes(query);

        if (searchMatch) {
          markersLayer.addLayer(marker);
          visibleCount++;
        } else {
          markersLayer.removeLayer(marker);
        }
      });

      document.getElementById('museum-count').textContent = `${visibleCount} of ${museums.length} museums`;
      renderMuseumList(query);
    }

    // --- Museum list ---
    function renderMuseumList(query) {
      const listDiv = document.getElementById('museum-list');
      listDiv.innerHTML = '';

      const filtered = museums.filter(m => {
        const searchMatch = !query || m.name.toLowerCase().includes(query) || m.address.toLowerCase().includes(query);
        return searchMatch;
      });

      filtered.forEach(m => {
        const item = document.createElement('div');
        item.className = 'museum-item';
        const color = getColor(m.region);
        item.innerHTML = `
          <div class="museum-name">${m.name}</div>
          <div class="museum-address">${m.address}</div>
          <span class="museum-region-dot" style="background:${color}"></span>
          <span class="museum-region">${m.region}</span>
        `;
        item.addEventListener('click', () => {
          map.setView([m.lat, m.lng], 13);
          // Open the corresponding marker popup
          allMarkers.forEach(marker => {
            if (marker.museumData === m) {
              marker.openPopup();
            }
          });
          // On mobile, close sidebar
          if (window.innerWidth < 768) {
            sidebar.classList.add('collapsed');
          }
        });
        listDiv.appendChild(item);
      });
    }

    // Initial render
    applyFilters();

    // --- Toggle sidebar ---
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // Start collapsed by default
    sidebar.classList.add('collapsed');
  </script>
